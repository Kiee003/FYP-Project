services:
  fyp-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fyp-dashboard
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
    env_file:
      - ./server/.env
    volumes:
      # Persist the SQLite database on the host so rebuilds DON'T wipe
      # registered users or audit history.
      - ./server/data:/app/data
    restart: unless-stopped